spring.application.name=notification-application

# Core SMTP Connection Parameters
spring.mail.host=://example.com
spring.mail.port=587
spring.mail.username=your-system-email@example.com
spring.mail.password=your-secure-password

# Protocol and Security Adjustments
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp

